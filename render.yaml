services:
  - type: web
    name: pulse-mcp-relay
    runtime: node
    rootDir: relay-server
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # Auto-generated on deploy - no manual step. Copy this value from the
      # Render dashboard's Environment tab once the service is live; it's
      # what you'll use as X-Pulse-Relay-Api-Key / relayApiKey.
      - key: PULSE_API_KEY
        generateValue: true
      # No persistent disk on the free plan (Render doesn't support disks
      # there), so DB_PATH is left at its default (a file inside the
      # container's own ephemeral filesystem). This means crash/log history
      # is wiped on every redeploy or restart - fine for trying this out.
      # If you upgrade to a paid Render plan later, add a disk and set
      # DB_PATH=/data/relay.db to persist data across restarts.
      # Optional - only needed for the Phase 2 automated crash-fix pipeline.
      # Leave blank in the Render dashboard to skip Phase 2 entirely.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
